[global]
error_log = /proc/self/fd/2

[www]
; The master runs as the image user (non-root); no user/group switching.
listen = 9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /fpm-ping
access.log = /dev/null
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
