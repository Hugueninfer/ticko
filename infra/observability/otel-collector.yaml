# OpenTelemetry Collector: receives OTLP from the API, the queue, the
# scheduler and the classifier on the internal `obs` network, scrubs it a
# second time and routes it: metrics -> Prometheus, traces -> Tempo,
# logs -> Loki.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50

  # Attributes that must never be stored, whoever sends them.
  attributes/drop-sensitive:
    actions:
      - { key: url.full, action: delete }
      - { key: url.query, action: delete }
      - { key: http.url, action: delete }
      - { key: http.target, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.response.header.set-cookie, action: delete }
      - { key: db.statement, action: delete }
      - { key: db.query.text, action: delete }
      - { key: enduser.id, action: delete }
      - { key: user.email, action: delete }
      - { key: client.address, action: delete }
      - { key: exception.message, action: delete }
      - { key: exception.stacktrace, action: delete }

  # Second layer after the application's own redaction: mask secrets and
  # personal data in any attribute value, and in attributes named like secrets.
  redaction:
    allow_all_keys: true
    redact_all_types: true
    summary: silent
    blocked_key_patterns:
      - "(?i).*(password|passwd|secret|api[_-]?key|authorization|cookie|session|access_token|refresh_token|bearer).*"
      - "(?i)^(.*[._-])?token$"
    blocked_values:
      - "(?i)bearer\\s+[A-Za-z0-9._~+/=|-]+"            # bearer tokens
      - "\\b[0-9]+\\|[A-Za-z0-9]{20,}\\b"                # Sanctum tokens
      - "\\bticko_[A-Za-z0-9]{16,}\\b"                  # Ticko token prefix
      - "\\bAIza[0-9A-Za-z_-]{30,}\\b"                  # Google API keys
      - "\\bgsk_[A-Za-z0-9]{20,}\\b"                    # Groq API keys
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)+"  # e-mail
      - "\\b[0-9]{3}\\.?[0-9]{3}\\.?[0-9]{3}-?[0-9]{2}\\b"      # CPF
      - "\\b(?:[0-9][ .-]?){13,19}\\b"                  # card numbers

  # Log bodies are not attributes: same rules with the transform processor.
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "(?i)bearer\\s+[A-Za-z0-9._~+/=|-]+", "Bearer [REDACTED]")
          - replace_pattern(body, "\\b[0-9]+\\|[A-Za-z0-9]{20,}\\b", "[REDACTED]")
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)+", "[EMAIL]")
          - replace_pattern(body, "\\b[0-9]{3}\\.?[0-9]{3}\\.?[0-9]{3}-?[0-9]{2}\\b", "[CPF]")
          - replace_pattern(body, "\\b(?:[0-9][ .-]?){13,19}\\b", "[CARTAO]")

  # PHP processes are short-lived and export deltas; Prometheus needs
  # cumulative series.
  # Keep idle series (bounded cardinality) so quiet periods show 0, not "No data".
  delta_to_cumulative:
    max_stale: 24h

  batch:
    timeout: 2s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 24h
    resource_to_telemetry_conversion:
      enabled: false

  otlp_http/tempo:
    endpoint: http://tempo:4318
    tls:
      insecure: true

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop-sensitive, redaction, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, redaction, delta_to_cumulative, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop-sensitive, redaction, transform/logs, batch]
      exporters: [otlp_http/loki]
