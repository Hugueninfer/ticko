# Prometheus scrapes only the Collector (application metrics and its own
# health). Retention and storage are set on the command line (compose.yaml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ticko
    # Keep the services' own job label (ticko/ticko-api, ticko/ticko-queue...).
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
