name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  PHP_EXTENSIONS: bcmath, exif, gd, intl, pcntl, pdo_pgsql, redis, zip
  NODE_VERSION: "22"

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer lint

  static-analysis:
    name: Static analysis (Larastan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: composer stan

  tests:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Throwaway credentials for the ephemeral CI database only.
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: ticko_app
      DB_PASSWORD: ci-app-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
      - name: Create the non-superuser application role (same script as docker compose)
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci-superuser-password
          POSTGRES_USER: postgres
          APP_DB_USER: ticko_app
          APP_DB_PASSWORD: ci-app-password
        run: sh infra/postgres/init/10-app-role.sh
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run the test suite (fails under 80% coverage)
        run: composer test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-clover
          path: apps/api/build/coverage/clover.xml
          retention-days: 7

  coverage-badge:
    name: Publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes the badge to the orphan "badges" branch only
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-clover
          path: coverage
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: none
      - run: php .github/scripts/coverage-badge.php coverage/clover.xml "$RUNNER_TEMP/coverage.svg"
      - name: Push badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          git init -q badges && cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan badges
          cp "$RUNNER_TEMP/coverage.svg" coverage.svg
          git add coverage.svg
          git commit -qm "Update coverage badge"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: none
      - run: composer audit --locked --no-interaction

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full history
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (also generates the API client types)
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint, Prettier)
        run: pnpm lint
      - name: Type check
        run: pnpm --filter '!@ticko/mobile' -r typecheck
      - name: Unit and component tests (fails under the coverage thresholds)
        run: pnpm --filter '!@ticko/mobile' -r test:coverage
      - name: Build
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  mobile:
    name: Mobile (lint, types, tests, bundle)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install (also generates the API client types)
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint, Prettier)
        run: pnpm exec eslint apps/mobile && pnpm exec prettier --check apps/mobile
      - name: Type check
        run: pnpm --filter @ticko/mobile typecheck
      - name: Tests (Jest + React Native Testing Library; fails under the coverage thresholds)
        run: pnpm --filter @ticko/mobile test:coverage --ci
      - name: Android bundle builds (production settings, HTTPS only)
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://ticko.example.com
          EXPO_PUBLIC_TENANT: acme
        run: pnpm exec expo export --platform android --output-dir "$RUNNER_TEMP/mobile-export"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the Docker stack with demo sign-in
        run: |
          ./scripts/make-env.sh
          echo "TICKO_RATE_LIMIT_DEMO=120" >> .env
          # One demo account drives the whole suite within a minute.
          echo "TICKO_RATE_LIMIT_API=600" >> .env
          docker compose up -d --build --wait
          docker compose exec -T api php artisan ticko:demo > /dev/null
      - name: Encrypted backup restores with identical data
        run: ./scripts/backup-verify.sh
      - name: Install Chromium for Playwright
        run: pnpm --filter @ticko/web exec playwright install --with-deps chromium
      - name: Run the end-to-end tests
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm --filter @ticko/web e2e --project chromium
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200 api web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  classifier:
    name: Classifier (lint, tests, evals, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/classifier
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TICKO_BASE_MODEL_DIR: ${{ github.workspace }}/.cache/bertimbau-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/classifier/requirements-dev.lock
      - name: Install (hash-locked, no dependency resolution, wheels only)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes --no-deps --only-binary=:all: -r requirements-dev.lock
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Lint (Ruff)
        run: ruff check . && ruff format --check .
      - name: Tests (sanitizer, dataset, service security; fails under the coverage threshold)
        run: pytest --cov
      - name: Audit dependencies (pip-audit)
        run: ./audit.sh
      - name: Eval baseline (F1 thresholds + prompt-injection eval)
        run: python -m ticko_classifier.evaluate --model baseline --check
      - name: Cache the base model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TICKO_BASE_MODEL_DIR }}
          key: bertimbau-${{ hashFiles('services/classifier/ticko_classifier/fetch_model.py') }}
      - name: Fetch the pinned base model (every file checked against its SHA-256)
        run: python -m ticko_classifier.fetch_model --dir "$TICKO_BASE_MODEL_DIR"
      - name: Eval LoRA model on the CPU (F1 thresholds + prompt-injection eval)
        run: python -m ticko_classifier.evaluate --model lora --check

  observability:
    name: Observability (Grafana, dashboards, redaction)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dashboards are generated from code (no drift)
        run: python3 infra/observability/grafana/build_dashboards.py && git diff --exit-code infra/observability/grafana/dashboards
      - name: Start the stack with the classifier and observability
        env:
          TICKO_TELEMETRY: "true"
          CLASSIFIER_URL: http://classifier:8000
          TICKO_DEMO_LOGIN: "true"
        run: |
          ./scripts/make-env.sh
          echo "TICKO_RATE_LIMIT_DEMO=120" >> .env
          echo "TICKO_RATE_LIMIT_API=600" >> .env
          echo "::add-mask::$(grep '^GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2-)"
          docker compose --profile ml --profile obs up -d --build --wait
          docker compose exec -T api php artisan ticko:demo > /dev/null
      - name: Install Chromium for Playwright
        run: pnpm --filter @ticko/web exec playwright install --with-deps chromium
      - name: Produce traffic (the app's end-to-end suite)
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm --filter @ticko/web e2e --project chromium
      - name: Grafana requires login and every panel has data
        env:
          GRAFANA_URL: http://localhost:3001
        run: GRAFANA_PASSWORD="$(grep '^GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2-)" pnpm --filter @ticko/web e2e --project observability
      - name: Stored logs and traces carry no personal data or credentials
        run: |
          # Demo e-mails, CPF-like numbers and bearer tokens must not appear in Loki.
          query='{service_name=~"ticko-.*"} |~ "@acme\\.test|[0-9]{3}\\.[0-9]{3}\\.[0-9]{3}-[0-9]{2}|Bearer [A-Za-z0-9]{8}"'
          found=$(docker compose exec -T grafana wget -qO- "http://loki:3100/loki/api/v1/query_range?limit=5&since=1h&query=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$query")" \
            | python3 -c 'import sys,json;print(sum(len(r["values"]) for r in json.load(sys.stdin)["data"]["result"]))')
          echo "matches: $found"
          test "$found" = 0
          total=$(docker compose exec -T grafana wget -qO- "http://loki:3100/loki/api/v1/query_range?limit=5&since=1h&query=$(python3 -c 'import urllib.parse;print(urllib.parse.quote("{service_name=~\"ticko-.*\"}"))')" \
            | python3 -c 'import sys,json;print(sum(len(r["values"]) for r in json.load(sys.stdin)["data"]["result"]))')
          echo "log lines checked: $total"
          test "$total" -gt 0
      - name: Grafana is only on the loopback interface
        run: |
          docker compose port grafana 3000 | grep -q '^127.0.0.1:'
          for service in otel-collector prometheus tempo loki; do
            test -z "$(docker compose port "$service" 4318 2>/dev/null; docker compose port "$service" 9090 2>/dev/null; docker compose port "$service" 3100 2>/dev/null; docker compose port "$service" 3200 2>/dev/null)"
          done
      - name: Stack logs
        if: failure()
        run: docker compose --profile ml --profile obs logs --no-color --tail 100 api queue otel-collector grafana
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-observability
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Build Docker images
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/php/Dockerfile
          target: prod
          push: false
          tags: ticko-api:ci
      - name: Build web (Caddy) image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/php/Dockerfile
          target: web
          push: false
          tags: ticko-web:ci
      - name: Build classifier image (pinned base image, non-root, no pip)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/classifier
          target: runtime
          push: false
          load: true
          tags: ticko-classifier:ci
      - name: Smoke-test the classifier image (read-only, no network, token required)
        run: |
          token=$(head -c 32 /dev/urandom | base64 | tr -d '/+=\n')
          docker run -d --name classifier --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --network none -e CLASSIFIER_TOKEN="$token" -e CLASSIFIER_MODEL=baseline ticko-classifier:ci
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' classifier)" = healthy ] && break
            sleep 2
          done
          test "$(docker exec classifier id -u)" = 10001
          if docker exec classifier sh -c 'command -v pip || python -m pip --version' 2>/dev/null; then exit 1; fi
          docker exec -e TOKEN="$token" classifier python -c "
          import json, os, urllib.request, urllib.error
          def call(token):
              req = urllib.request.Request('http://127.0.0.1:8000/v1/classify', json.dumps({'text': 'Meu pedido não chegou, preciso urgente'}).encode(),
                                           {'Content-Type': 'application/json', 'Authorization': f'Bearer {token}'})
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  return e.code, None
          assert call('wrong')[0] == 401
          status, body = call(os.environ['TOKEN'])
          assert status == 200 and body['category']['label'] == 'entrega', body
          print('classifier ok:', body)
          "
          # The ticket text never reaches the logs.
          if docker logs classifier 2>&1 | grep -qi 'pedido'; then exit 1; fi
