# Ticko — local stack. Start everything with `make up` (creates .env first).
#
# Networks:
#   edge     — only the Caddy web server publishes a port (127.0.0.1 by default).
#   backend  — internal: Postgres and Redis are unreachable from outside Docker.
#   realtime — internal: the Reverb WebSocket server; browsers and phones reach
#              it only through Caddy (/app/*), never on a port of its own.
#   ml       — internal: the ticket classifier, reachable only by the queue
#              (with a service token). Optional: `make up-ml`.
#   obs      — internal: OpenTelemetry Collector, Prometheus, Tempo, Loki and
#              Grafana. Optional: `make up-obs`. Only Grafana publishes a port
#              (127.0.0.1, login required) through `obs-edge`.

name: ticko

x-api-env: &api-env
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    # Read from the shell or .env; off unless explicitly enabled.
    TICKO_DEMO_LOGIN: ${TICKO_DEMO_LOGIN:-false}
    # The API and the queue publish realtime events to Reverb on the internal network.
    BROADCAST_CONNECTION: reverb
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
    # Empty = classification off. `make up-ml` sets it to http://classifier:8000.
    CLASSIFIER_URL: ${CLASSIFIER_URL:-}
    # Off = no telemetry sent anywhere. `make up-obs` turns it on.
    TICKO_TELEMETRY: ${TICKO_TELEMETRY:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_SERVICE_NAME: ticko-api

x-api-common: &api-common
  build:
    context: .
    dockerfile: infra/docker/php/Dockerfile
    target: prod
  image: ticko-api:local
  env_file: .env
  environment: *api-env
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - api-storage:/var/www/html/storage
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      target: web
    image: ticko-web:local
    depends_on:
      api:
        condition: service_healthy
      reverb:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge, realtime]
    read_only: true
    tmpfs:
      - /data
      - /config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  api:
    <<: *api-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [edge, backend, realtime, obs]
    # The search playground embeds the query in the request (Ollama on this computer).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  queue:
    <<: *api-common
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: ticko-queue
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # egress: AI providers (Gemini, Groq) are called from queued jobs.
    # ml: the classifier, called from the ClassifyTicket job.
    networks: [backend, realtime, egress, ml, obs]
    # Lets jobs reach an Ollama server running on this computer (OLLAMA_URL).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # WebSocket server (Laravel Reverb). Only reachable through Caddy at /app/*;
  # its HTTP publishing API (/apps/*) is only reachable inside Docker.
  reverb:
    <<: *api-common
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [realtime]

  # Runs scheduled commands: Horizon snapshots, token pruning and, with
  # telemetry on, the SLA and queue gauges every minute.
  scheduler:
    <<: *api-common
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: ticko-scheduler
    command: ["php", "artisan", "schedule:work"]
    # `docker compose up --wait` needs a healthcheck on every service.
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend, obs]

  # Ticket classifier (services/classifier): category, priority and sentiment.
  # No published port, no outbound network, non-root, read-only filesystem.
  classifier:
    build:
      context: services/classifier
      target: runtime
    image: ticko-classifier:local
    profiles: [ml]
    environment:
      CLASSIFIER_TOKEN: ${CLASSIFIER_TOKEN:?run make env first}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-lora}
      TICKO_TELEMETRY: ${TICKO_TELEMETRY:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    networks: [ml, obs]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  # --- Observability (`make up-obs`) ---------------------------------------
  # Everything on the internal `obs` network; only Grafana has a host port.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    profiles: [obs]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [obs]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [obs]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    profiles: [obs]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [obs]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    profiles: [obs]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infra/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [obs]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles: [obs]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    environment:
      # Login required: no anonymous access, no sign-up, no basic auth on the
      # API; the admin password is generated by `make env` (never a default).
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make env first}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_ANGULAR_SUPPORT_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 20
    networks: [obs, obs-edge]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  migrate:
    <<: *api-common
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  postgres:
    # pgvector/pgvector pinned by digest, with Debian security updates and
    # without gosu (infra/docker/postgres); runs as the postgres user.
    build:
      context: infra/docker/postgres
    image: ticko-postgres:local
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run make env first}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${DB_DATABASE:-ticko}
      APP_DB_USER: ${DB_USERNAME:-ticko_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?run make env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run make env first}", "--appendonly", "yes", "--protected-mode", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The entrypoint fixes /data ownership, then drops to the redis user.
    cap_add: [CHOWN, SETUID, SETGID]
    restart: unless-stopped

  # Development tooling (composer, tests, linters). Not started by `up`.
  #   docker compose run --rm dev composer test
  dev:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ticko-api:dev
    profiles: [tools]
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend, egress]

  # Optional: publish Postgres on the loopback interface for local GUI tools.
  #   docker compose --profile db-port up -d postgres-port
  postgres-port:
    image: alpine/socat:1.8.1.3@sha256:fb3862c949af7c79996d0e514ee96128644d840835ed5368eeecb14a869de361
    profiles: [db-port]
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    networks: [backend, egress]

networks:
  edge: {}
  egress: {}
  backend:
    internal: true
  realtime:
    internal: true
  ml:
    internal: true
  obs:
    internal: true
  # Only for Grafana's loopback port.
  obs-edge: {}

volumes:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
  postgres-data:
  redis-data:
  api-storage:
