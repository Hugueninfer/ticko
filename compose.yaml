# Ticko — local stack. Start everything with `make up` (creates .env first).
#
# Networks:
#   edge     — only the Caddy web server publishes a port (127.0.0.1 by default).
#   backend  — internal: Postgres and Redis are unreachable from outside Docker.

name: ticko

x-api-common: &api-common
  build:
    context: .
    dockerfile: infra/docker/php/Dockerfile
    target: prod
  image: ticko-api:local
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    REDIS_HOST: redis
    # Read from the shell or .env; off unless explicitly enabled.
    TICKO_DEMO_LOGIN: ${TICKO_DEMO_LOGIN:-false}
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - api-storage:/var/www/html/storage
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  restart: unless-stopped

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      target: web
    image: ticko-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [edge]
    read_only: true
    tmpfs:
      - /data
      - /config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  api:
    <<: *api-common
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [edge, backend]

  queue:
    <<: *api-common
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [backend]

  migrate:
    <<: *api-common
    command: ["php", "artisan", "migrate", "--force"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run make env first}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${DB_DATABASE:-ticko}
      APP_DB_USER: ${DB_USERNAME:-ticko_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?run make env first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    image: redis:8.6-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run make env first}", "--appendonly", "yes", "--protected-mode", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The entrypoint fixes /data ownership, then drops to the redis user.
    cap_add: [CHOWN, SETUID, SETGID]
    restart: unless-stopped

  # Development tooling (composer, tests, linters). Not started by `up`.
  #   docker compose run --rm dev composer test
  dev:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ticko-api:dev
    profiles: [tools]
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend, egress]

  # Optional: publish Postgres on the loopback interface for local GUI tools.
  #   docker compose --profile db-port up -d postgres-port
  postgres-port:
    image: alpine/socat:1.8.0.3
    profiles: [db-port]
    command: ["TCP-LISTEN:5432,fork,reuseaddr", "TCP:postgres:5432"]
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5433}:5432"
    networks: [backend, egress]

networks:
  edge: {}
  egress: {}
  backend:
    internal: true

volumes:
  postgres-data:
  redis-data:
  api-storage:
